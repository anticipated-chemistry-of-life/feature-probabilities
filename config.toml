# feature-probabilities pipeline config.
#
# Loaded by generate-groundtruth, fit-kde, and annotate via
# feature_probabilities.config.load_config(). Each CLI's flags override
# individual keys here; an unset flag leaves this file's value untouched.
# Check in changes to this file so a reproducible run is a versioned file,
# not an invocation buried in shell history.

db_path = "db/database.duckdb"

# Installed SIRIUS version the SIRIUS-touching executables require; a
# mismatch fails fast before any SIRIUS call is made. Bump deliberately when
# upgrading the pipeline to a newer SIRIUS release.
required_sirius_version = "6.5.4"

# Ground truth set (GLOSSARY.md): the revision (commit SHA) of the
# HuggingFace dataset salutmoic/msnlib-ms2-parquet whose msnlib_ms2.parquet
# generate-groundtruth fetches. MSnLib covers both Ionization modes; its
# ALL_ENERGIES spectra are kept, minus ambiguous-identity and
# undetectable-adduct ones (ADR 0002). Pinned so a regeneration is
# reproducible when the dataset's main branch moves; --ground-truth-revision
# overrides it for one run.
ground_truth_revision = "d3bc66eec151ca3efb6d2a3ea055c22f167f0ca9"

# Default pickle path fit-kde writes its calibration artifact to: one KDE
# per Ionization mode (positive, negative). Overridable per-run via --output.
kde_output_path = "models/kde_model.pkl"

# `--smoke-test` mode of every CLI: a small, isolated end-to-end run for
# iterating on the pipeline. `generate-groundtruth --smoke-test` deletes and
# recreates `db_path` on every run, so it must never be the real db_path
# (enforced). `annotate --smoke-test` defaults its inputs and export to the
# values below; any explicitly passed flag still wins. Each smoke mzML's
# Ionization mode and instrument model come from its row in `metadata_csv`,
# as in any `annotate` batch.
[smoke_test]
db_path = "db/smoke_test/database.duckdb"
kde_output_path = "models/smoke_test/kde_model.pkl"
# First N spectra of each Ionization mode (positive, negative) of the Ground
# truth set, after filtering, in parquet order.
spectra_per_ionization_mode = 500
mzml_dir = "data/smoke_test"
metadata_csv = "data/smoke_test/metadata.tsv"
export_path = "db/smoke_test/feature_probabilities.csv"

[sirius]
# Top-k (GLOSSARY.md): how many best-ranked structure candidates per Feature
# every SIRIUS run -- ground truth and field alike -- retains; lower-ranked
# candidates never become Annotations. Part of each run's caching key, so
# changing it reruns SIRIUS for every input. See
# docs/adr/0001-top-k-structure-candidates.md.
top_k = 200

[sirius.analysis_params]
# SIRIUS `JobSubmission` analysis parameters, sent verbatim with every run of
# every SIRIUS-touching executable. Seeded from SIRIUS 6.3.3's own
# `GET /api/default-job-config` so a run is reproducible from this versioned
# file rather than from whatever defaults the installed SIRIUS happens to
# carry. Only parameters that affect a result are pinned here; the tools we
# do not run carry `enabled = false` and no parameter payload.
#
# `recompute` is deliberately absent: it is a control flag set from `--force`,
# not an analysis parameter, and `checksums.analysis_params_checksum` excludes
# it so forcing a rerun cannot fork the cache.
#
# Adduct settings are SIRIUS's defaults verbatim, covering both Ionization
# modes: ground truth and field runs alike share this section, in both modes.
fallback_adducts = ["[M - H]-", "[M + K]+", "[M + H]+", "[M + Na]+"]
enforced_adducts = []
detectable_adducts = [
    "[M - CH2O3 - H]-", "[M + CH2O2 + H]+", "[M - CH3 - H]-",
    "[M + C2H3N + H]+", "[M - H2O + H]+", "[M - CO2 - H]-", "[2M + Cl]-",
    "[2M + H]+", "[M + H2O - H]-", "[M + H]+", "[M + Na]+", "[M + Cl]-",
    "[2M + Na]+", "[M + CH2O2 - H]-", "[M - H + Na - H]-",
    "[M + C2H4O2 - H]-", "[2M + H]-", "[M - H2O - H]-", "[M - H]-",
    "[M - H3N - H]-", "[M + K]+", "[2M + K]+", "[M + H3N + H]+",
    "[M + Br]-", "[2M + Br]-", "[M - H4O2 + H]+",
]

# SIRIUS molecular formula identification. `profile` is deliberately absent:
# the shared builder `instrument.analysis_params_for_instrument_type` injects
# the profile of a SIRIUS run's own Instrument type (GLOSSARY.md), so a value
# here could only ever disagree with the data it is applied to.
# `generate-groundtruth` builds every chunk's parameters through it, and
# `annotate` every field run's, from the Instrument type its metadata row's
# `instrument_model` resolves to.
[sirius.analysis_params.formula_id_params]
enabled = true
number_of_candidates = 10
number_of_candidates_per_ionization = 1
mass_accuracy_ms2ppm = 10.0
isotope_ms2_settings = "IGNORE"
filter_by_isotope_pattern = true
enforce_el_gordo_formula = true
perform_bottom_up_search = true
perform_denovo_below_mz = 400.0
apply_formula_constraints_to_db_and_bottom_up_search = false
enforced_formula_constraints = "HCNOP"
fallback_formula_constraints = "S"
detectable_elements = ["B", "Mg", "S", "Cl", "Fe", "Zn", "Se", "Br"]
inject_spec_lib_match_formulas = true
min_score_to_inject_spec_lib_match = 0.7
min_peaks_to_inject_spec_lib_match = 6

# Sent to SIRIUS as `configMap` entries, not the `useHeuristic` object:
# SIRIUS 6.5.4's server drops the object's values and runs with 0/0
# (`sirius.job_submission_from_config`).
[sirius.analysis_params.formula_id_params.use_heuristic]
use_heuristic_above_mz = 300
use_only_heuristic_above_mz = 650

# CSI:FingerID fingerprint prediction.
[sirius.analysis_params.fingerprint_prediction_params]
enabled = true
use_score_threshold = true
always_predict_high_ref_matches = true

# CANOPUS compound-class prediction. Enabled not because the classes are
# consumed, but because SIRIUS 6.3.3's CLI parser only accepts the
# `structures` subcommand after `classes`: dropping it makes every job
# submission fail with `400 Cannot create Job Command!`.
[sirius.analysis_params.canopus_params]
enabled = true

# CSI:FingerID structure database search. `BIO` (the aggregate biological
# database) is the single search space shared by ground-truth and field runs
# -- a KDE calibrated against one search space is not valid for another.
[sirius.analysis_params.structure_db_search_params]
enabled = true
structure_search_dbs = ["BIO"]
tag_structures_with_lipid_class = false
expansive_search_confidence_mode = "APPROXIMATE"

# Tools this pipeline does not run.
[sirius.analysis_params.spectra_search_params]
enabled = false

[sirius.analysis_params.zodiac_params]
enabled = false

[sirius.analysis_params.ms_novelist_params]
enabled = false

[sirius.import_params]
# Default SIRIUS LcmsSubmissionParameters for mzML peak-picking import.
# Populated as the SIRIUS wrapper (issue #15) settles on the fields it needs.

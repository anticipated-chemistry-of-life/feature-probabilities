[project]
name = "feature-probabilities"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
    "duckdb>=1.4.1",
    "duckdb-engine>=0.17.0",
    "fsspec>=2026.7.0",
    "huggingface-hub>=1.27.0",
    "marimo[lsp]>=0.23.16",
    "matchms>=0.32.0",
    "pandas>=3.0.5",
    "polars>=1.43.1",
    "pyarrow>=25.0.0",
    "pysirius",
    "rdkit>=2026.3.5",
    "scikit-learn>=1.9.0",
    "scipy>=1.16.3",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.44",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ruff>=0.15.7",
]

[tool.uv.sources]
pysirius = { git = "https://github.com/sirius-ms/sirius-client-openAPI.git", subdirectory = "client-api_python/generated" }

[tool.ruff]
extend-exclude = ["external", "sandbox_*.py"]

[tool.ruff.lint]
extend-select = ["ANN"]
